<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Source+Sans+3:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FFFFFF; color: #17365B; font-family: "Source Sans 3", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #17365B; text-decoration: none; }
  a:hover { color: #2E4057; }
  input, textarea, select, button { font: inherit; color: inherit; }
  @keyframes fu { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</helmet>

<div style="width:100%;overflow-x:hidden">
  <header style="position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid #E7E9EC">
    <div style="max-width:1140px;margin:0 auto;padding:0 24px;min-height:74px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;flex-shrink:0">
        <img src="assets/fagus-mark.png" alt="" style="height:36px;width:auto;display:block;mix-blend-mode:multiply">
        <img src="assets/fagus-wordmark.png" alt="Fagus Ed" style="height:17px;width:auto;display:block;mix-blend-mode:multiply">
      </a>
      <nav style="display:flex;flex-wrap:wrap;align-items:center;gap:22px;font-size:15px;color:#2E4057">
        <a href="index.html" style="color:#2E4057">Inicio</a>
        <a href="programas.html" style="color:#2E4057">Programas</a>
        <a href="material.html" style="color:#2E4057">Material</a>
        <a href="tutoria.html" style="color:#2E4057">Tutoría</a>
      </nav>
    </div>
  </header>

  <section style="max-width:1140px;margin:0 auto;padding:76px 24px 44px">
    <div style="font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A3ABB6;margin-bottom:20px;animation:fu .8s cubic-bezier(.2,.8,.2,1) both">{{ kicker }}</div>
    <h1 style="font-family:Figtree,sans-serif;font-weight:600;font-size:clamp(34px,4.6vw,54px);line-height:1.06;letter-spacing:-.02em;margin:0;max-width:20ch;text-wrap:pretty;animation:fu .9s cubic-bezier(.2,.8,.2,1) .08s both">{{ title }}</h1>
    <p style="font-size:19px;line-height:1.6;color:#5A6675;max-width:60ch;margin:24px 0 0;text-wrap:pretty;animation:fu .9s cubic-bezier(.2,.8,.2,1) .16s both">{{ intro }}</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:34px">
      <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="4">
        <button onClick="{{ k.onClick }}" style="{{ k.style }}">{{ k.label }}</button>
      </sc-for>
    </div>
  </section>

  <section style="background:#F9F9F9;border-top:1px solid #E7E9EC;border-bottom:1px solid #E7E9EC">
    <div style="max-width:1140px;margin:0 auto;padding:52px 24px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:44px;align-items:start">

      <div>
        <div style="font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A3ABB6;margin-bottom:16px">1 · Tus datos</div>
        <div style="display:grid;gap:16px">
          <label style="display:flex;flex-direction:column;gap:7px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.1em;color:#7F8996">NOMBRE Y APELLIDO
            <input value="{{ name }}" onChange="{{ onName }}" style="background:#FFFFFF;border:1px solid #E7E9EC;padding:12px 14px;font-size:15px;font-family:'Source Sans 3',sans-serif">
          </label>
          <label style="display:flex;flex-direction:column;gap:7px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.1em;color:#7F8996">EMAIL
            <input type="email" value="{{ email }}" onChange="{{ onEmail }}" style="background:#FFFFFF;border:1px solid #E7E9EC;padding:12px 14px;font-size:15px;font-family:'Source Sans 3',sans-serif">
          </label>
          <label style="display:flex;flex-direction:column;gap:7px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.1em;color:#7F8996">TELÉFONO
            <input value="{{ phone }}" onChange="{{ onPhone }}" style="background:#FFFFFF;border:1px solid #E7E9EC;padding:12px 14px;font-size:15px;font-family:'Source Sans 3',sans-serif">
          </label>
          <label style="display:flex;flex-direction:column;gap:7px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.1em;color:#7F8996">{{ extraLabel }}
            <input value="{{ extra }}" onChange="{{ onExtra }}" placeholder="{{ extraPlaceholder }}" style="background:#FFFFFF;border:1px solid #E7E9EC;padding:12px 14px;font-size:15px;font-family:'Source Sans 3',sans-serif">
          </label>
          <label style="display:flex;flex-direction:column;gap:7px;font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.1em;color:#7F8996">EN QUÉ NECESITAS APOYO
            <textarea rows="4" value="{{ notes }}" onChange="{{ onNotes }}" style="background:#FFFFFF;border:1px solid #E7E9EC;padding:12px 14px;font-size:15px;font-family:'Source Sans 3',sans-serif;resize:vertical"></textarea>
          </label>
        </div>
      </div>

      <div>
        <div style="font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A3ABB6;margin-bottom:16px">2 · Elige un horario</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="6">
            <button onClick="{{ d.onClick }}" style="{{ d.style }}">
              <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">{{ d.dow }}</div>
              <div style="font-size:16px;font-weight:600;margin-top:3px">{{ d.dom }}</div>
              <div style="font-size:11px;opacity:.7;margin-top:2px">{{ d.mon }}</div>
            </button>
          </sc-for>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px">
          <sc-for list="{{ times }}" as="tm" hint-placeholder-count="8">
            <button onClick="{{ tm.onClick }}" style="{{ tm.style }}">{{ tm.label }}</button>
          </sc-for>
        </div>
        <div style="margin-top:26px;background:#FFFFFF;border:1px solid #E7E9EC;padding:24px">
          <div style="font-family:Figtree,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A3ABB6">Resumen</div>
          <div style="font-family:Figtree,sans-serif;font-weight:600;font-size:18px;margin-top:10px;color:#17365B;text-wrap:pretty">{{ summary }}</div>
          <div style="font-size:14px;color:#7F8996;margin-top:6px">{{ summaryNote }}</div>
          <button onClick="{{ onBook }}" style="{{ bookStyle }}">{{ bookLabel }}</button>
          <div style="font-size:13px;color:#A3ABB6;margin-top:12px;line-height:1.5">{{ bookHint }}</div>
        </div>
      </div>

    </div>
  </section>

  <section style="max-width:1140px;margin:0 auto;padding:64px 24px 80px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:#E7E9EC;border:1px solid #E7E9EC">
      <sc-for list="{{ steps }}" as="st" hint-placeholder-count="3">
        <div style="background:#FFFFFF;padding:28px 26px">
          <div style="font-family:Figtree,sans-serif;font-size:12px;color:#A3ABB6;letter-spacing:.1em">{{ st.num }}</div>
          <div style="font-family:Figtree,sans-serif;font-weight:600;font-size:17px;margin-top:14px;color:#17365B">{{ st.title }}</div>
          <p style="font-size:15px;line-height:1.6;color:#7F8996;margin:8px 0 0;text-wrap:pretty">{{ st.body }}</p>
        </div>
      </sc-for>
    </div>
  </section>

  <footer style="border-top:1px solid #E7E9EC">
    <div style="max-width:1140px;margin:0 auto;padding:48px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px">
      <a href="index.html" style="display:flex;align-items:center;gap:12px">
        <img src="assets/fagus-mark.png" alt="" style="height:30px;width:auto;display:block;mix-blend-mode:multiply">
        <img src="assets/fagus-wordmark.png" alt="Fagus Ed" style="height:14px;width:auto;display:block;mix-blend-mode:multiply">
      </a>
      <div style="font-size:14px;color:#A3ABB6">Horario de atención: lunes a viernes, 9:00 a 19:00 (Chile).</div>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { kind: null, dayIdx: 0, time: null, name: '', email: '', phone: '', extra: '', notes: '', booked: false };

  KINDS = {
    familias: {
      label: 'Asesoría a familias',
      kicker: 'Asesoría a familias',
      title: 'Agenda una asesoría para tu familia',
      intro: 'Completa el formulario y elige un horario disponible. Confirmamos por correo con la invitación de Google Calendar y el enlace de la videollamada.',
      extraLabel: 'CURSO Y COLEGIO ACTUAL',
      extraPlaceholder: 'Ej: 7° básico, Colegio San Pedro',
      duration: 45,
      event: 'Asesoría a familias · Fagus Ed'
    },
    vocacional: {
      label: 'Orientación vocacional en Chile',
      kicker: 'Orientación vocacional',
      title: 'Agenda tu sesión de orientación vocacional',
      intro: 'Cuéntanos en qué etapa estás y elige un horario. La primera sesión revisa intereses, alternativas de carrera y puntajes de referencia.',
      extraLabel: 'CURSO ACTUAL',
      extraPlaceholder: 'Ej: 3° medio',
      duration: 60,
      event: 'Orientación vocacional · Fagus Ed'
    },
    admision: {
      label: 'Admisión en el extranjero',
      kicker: 'Admisión en el extranjero',
      title: 'Agenda tu sesión de admisión en el extranjero',
      intro: 'Indica los países o universidades que te interesan y elige un horario. Revisamos requisitos, plazos y qué falta en tu perfil.',
      extraLabel: 'PAÍSES O UNIVERSIDADES DE INTERÉS',
      extraPlaceholder: 'Ej: Reino Unido, España',
      duration: 60,
      event: 'Admisión en el extranjero · Fagus Ed'
    },
    tutoria: {
      label: 'Diagnóstico de tutoría',
      kicker: 'Tutoría privada',
      title: 'Agenda tu diagnóstico de tutoría',
      intro: 'Treinta minutos para ubicar el nivel actual en la asignatura y proponer un plan de sesiones.',
      extraLabel: 'ASIGNATURA Y PROGRAMA',
      extraPlaceholder: 'Ej: Física IGCSE',
      duration: 30,
      event: 'Diagnóstico de tutoría · Fagus Ed'
    }
  };

  TIMES = ['09:00', '10:00', '11:00', '12:00', '15:00', '16:00', '17:00', '18:00'];
  DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  MON = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

  currentKind() {
    if (this.state.kind) return this.state.kind;
    const m = (typeof location !== 'undefined' ? location.search : '').match(/[?&]s=([a-z]+)/);
    return m && this.KINDS[m[1]] ? m[1] : 'familias';
  }

  weekdays(n) {
    const out = [];
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 1);
    while (out.length < n) {
      if (d.getDay() !== 0 && d.getDay() !== 6) out.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  gcalStamp(dt) {
    const p = (v) => String(v).padStart(2, '0');
    return dt.getUTCFullYear() + p(dt.getUTCMonth() + 1) + p(dt.getUTCDate()) + 'T' + p(dt.getUTCHours()) + p(dt.getUTCMinutes()) + '00Z';
  }

  renderVals() {
    const key = this.currentKind();
    const k = this.KINDS[key];
    const days = this.weekdays(8);
    const day = days[this.state.dayIdx] || days[0];
    const time = this.state.time;
    const ready = !!(time && this.state.name.trim() && this.state.email.trim());

    const chip = (active) => `border:1px solid ${active ? '#17365B' : '#E7E9EC'};background:${active ? '#17365B' : '#FFFFFF'};color:${active ? '#FFFFFF' : '#2E4057'};padding:10px 16px;font-family:Figtree,sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .25s ease`;

    const book = () => {
      if (!ready) return;
      const [hh, mm] = time.split(':').map(Number);
      const start = new Date(day);
      start.setHours(hh, mm, 0, 0);
      const end = new Date(start.getTime() + k.duration * 60000);
      const details = [
        'Solicitud enviada desde el sitio de Fagus Ed.',
        'Nombre: ' + this.state.name,
        'Email: ' + this.state.email,
        this.state.phone ? 'Teléfono: ' + this.state.phone : '',
        this.state.extra ? k.extraLabel + ': ' + this.state.extra : '',
        this.state.notes ? 'Notas: ' + this.state.notes : ''
      ].filter(Boolean).join('\n');
      const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent(k.event)
        + '&dates=' + this.gcalStamp(start) + '/' + this.gcalStamp(end)
        + '&details=' + encodeURIComponent(details)
        + '&location=' + encodeURIComponent('Videollamada');
      window.open(url, '_blank', 'noopener');
      this.setState({ booked: true });
    };

    return {
      kicker: k.kicker, title: k.title, intro: k.intro,
      extraLabel: k.extraLabel, extraPlaceholder: k.extraPlaceholder,
      kinds: Object.keys(this.KINDS).map(id => ({
        label: this.KINDS[id].label,
        onClick: () => this.setState({ kind: id, booked: false }),
        style: chip(id === key)
      })),
      name: this.state.name, email: this.state.email, phone: this.state.phone,
      extra: this.state.extra, notes: this.state.notes,
      onName: (e) => this.setState({ name: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPhone: (e) => this.setState({ phone: e.target.value }),
      onExtra: (e) => this.setState({ extra: e.target.value }),
      onNotes: (e) => this.setState({ notes: e.target.value }),
      days: days.map((d, i) => ({
        dow: this.DOW[d.getDay()], dom: d.getDate(), mon: this.MON[d.getMonth()],
        onClick: () => this.setState({ dayIdx: i, time: null, booked: false }),
        style: `border:1px solid ${i === this.state.dayIdx ? '#17365B' : '#E7E9EC'};background:${i === this.state.dayIdx ? '#17365B' : '#FFFFFF'};color:${i === this.state.dayIdx ? '#FFFFFF' : '#2E4057'};padding:11px 14px;min-width:66px;font-family:Figtree,sans-serif;cursor:pointer;text-align:center;transition:all .25s ease`
      })),
      times: this.TIMES.map(tm => ({
        label: tm,
        onClick: () => this.setState({ time: tm, booked: false }),
        style: chip(time === tm) + ';text-align:center'
      })),
      summary: time
        ? this.DOW[day.getDay()] + ' ' + day.getDate() + ' ' + this.MON[day.getMonth()] + ', ' + time + ' h · ' + k.duration + ' min'
        : 'Selecciona un horario',
      summaryNote: k.label + ' · videollamada',
      bookLabel: this.state.booked ? 'Abriendo Google Calendar…' : 'Agendar en Google Calendar',
      bookStyle: `margin-top:20px;width:100%;border:0;background:${ready ? '#17365B' : '#C9D0DA'};color:#FFFFFF;padding:14px;font-family:Figtree,sans-serif;font-weight:600;font-size:15px;cursor:${ready ? 'pointer' : 'not-allowed'};transition:background .25s ease`,
      onBook: book,
      bookHint: ready
        ? 'Se abrirá Google Calendar con la reunión precargada. Nosotros confirmamos por correo dentro del día hábil siguiente.'
        : 'Completa nombre, email y horario para habilitar el botón.',
      steps: [
        { num: '01', title: 'Envías la solicitud', body: 'Con tus datos y el horario que prefieres, sujeto a confirmación.' },
        { num: '02', title: 'Confirmamos por correo', body: 'Recibes la invitación de Google Calendar con el enlace de la videollamada.' },
        { num: '03', title: 'Sesión y resumen', body: 'Después de la reunión enviamos un resumen escrito con las recomendaciones.' }
      ]
    };
  }
}

</script>
</body>
</html>
